name: b
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: macos-12
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          unzip -qo *.zip || true
          S=$(find . -type d -name src | head -1)
          echo S=$S
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang++ -arch arm64 -isysroot "$SDK" \
            -miphoneos-version-min=15.0 -dynamiclib -fobjc-arc -fblocks \
            -std=c++17 -O2 -DNDEBUG -fvisibility=hidden -Wno-everything \
            -framework Foundation -framework UIKit -framework Metal \
            -framework QuartzCore -framework CoreGraphics \
            -undefined dynamic_lookup -I"$S" "$S"/*.mm "$S"/*.cpp \
            -o DFMKit.dylib
          codesign -f -s - DFMKit.dylib
          xcrun -sdk iphoneos metal -c "$S/DFMOverlay.metal" -o a.air
          xcrun -sdk iphoneos metallib a.air -o DFMOverlay.metallib
          ls -lh DFMKit.dylib DFMOverlay.metallib
      - uses: actions/upload-artifact@v4
        with:
          name: d
          path: |
            DFMKit.dylib
            DFMOverlay.metallib
